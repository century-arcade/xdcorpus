# GitHub Pages site for the xd Crossword Corpus: https://centuryarcade.org/xdcorpus/
#
# README.md is the front page (jekyll-readme-index, on by default on GitHub
# Pages), and every other .md file is published as .html with its relative
# links rewritten (jekyll-optional-front-matter, jekyll-relative-links).
# The schema.org Dataset metadata is in _includes/head-custom.html.

title: The xd Crossword Corpus
description: >-
  More than 160,000 published crosswords from over 160 publications, 1913 to
  today, kept in plain text for research and preservation.
url: https://centuryarcade.org
baseurl: /xdcorpus
lang: en-US
theme: jekyll-theme-primer
# Short subtitle for the front page's <title>; without it jekyll-seo-tag
# appends the whole description.
tagline: Published crosswords, 1913 to today

# Serve the .md files only as rendered .html, not also as raw copies.
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true

# Clean URLs: no .html, no capitals. Each policy page is served at a
# lowercase directory URL (ACCESS.md -> /access/); the old UPPER.html address
# redirects there (jekyll-redirect-from). Pages under assessments/ get
# directory URLs from their already-lowercase file names.
permalink: pretty
plugins:
  - jekyll-redirect-from
defaults:
  - scope: { path: "ACCESS.md" }
    values: { permalink: /access/, redirect_from: [/ACCESS.html] }
  - scope: { path: "AI.md" }
    values: { permalink: /ai/, redirect_from: [/AI.html] }
  - scope: { path: "COLLECTION.md" }
    values: { permalink: /collection/, redirect_from: [/COLLECTION.html] }
  - scope: { path: "CONTRIBUTING.md" }
    values: { permalink: /contributing/, redirect_from: [/CONTRIBUTING.html] }
  - scope: { path: "DATASETS.md" }
    values: { permalink: /datasets/, redirect_from: [/DATASETS.html] }
  - scope: { path: "DECISIONS.md" }
    values: { permalink: /decisions/, redirect_from: [/DECISIONS.html] }
  - scope: { path: "EDITORIAL.md" }
    values: { permalink: /editorial/, redirect_from: [/EDITORIAL.html] }
  - scope: { path: "GOVERNANCE.md" }
    values: { permalink: /governance/, redirect_from: [/GOVERNANCE.html] }
  - scope: { path: "PRESERVATION.md" }
    values: { permalink: /preservation/, redirect_from: [/PRESERVATION.html] }
